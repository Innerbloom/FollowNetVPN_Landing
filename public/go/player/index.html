  Ad prelander (fake video player → AppsFlyer → store). Not indexed.

  Optional: lang=en|es|pt|id|hi|ar|tr|ru
  Cloudflare Pages: public/go/player/index.html → /go/player after flatten-prerender.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#484848;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden;overscroll-behavior:none}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit;touch-action:manipulation}
.wrap{height:100%;display:flex;align-items:center;justify-content:center;padding:16px}

/* player: 16:9 on desktop, full screen on phones */
.player{position:relative;width:100%;max-width:880px;aspect-ratio:16/9;background:#000;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
@media (max-width:767px),(pointer:coarse) and (orientation:portrait),(orientation:landscape) and (max-height:500px){
  .wrap{padding:0}
  .player{max-width:none;width:100vw;height:100vh;height:100dvh;aspect-ratio:auto}
}

/* "video" layer */
.screen{position:absolute;inset:0;transition:filter .35s}
.screen canvas,.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.player.paused .screen{filter:brightness(.55)}
.player.locked .screen{filter:blur(10px) brightness(.45)}

/* title strip */
.head{position:absolute;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 12px 28px;display:flex;align-items:center;gap:10px;background:linear-gradient(rgba(0,0,0,.65),transparent);z-index:3;transition:opacity .3s}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform .15s}
.round:active{transform:scale(.88)}
.round.x{background:#cfcfcf}
.round.like{background:#1877f2}
.round.like.on{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.35)}100%{transform:scale(1)}}
.round svg{width:20px;height:20px}
.likes{color:#fff;font-size:13px;font-weight:600;min-width:32px}
.ttl{flex:1;min-width:0;color:#fff;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px #000}
.ttl small{display:block;font-size:12px;font-weight:400;color:#ccc}
.hd{background:#e11d48;color:#fff;font-size:11px;font-weight:700;padding:3px 6px;border-radius:4px;letter-spacing:.5px}

/* center play / spinner */
.bigplay{position:absolute;left:50%;top:50%;width:72px;height:72px;margin:-36px 0 0 -36px;border:3px solid #fff;border-radius:50%;display:grid;place-items:center;z-index:5;pointer-events:none;transition:opacity .25s,transform .25s}
.bigplay:after{content:"";margin-left:6px;border-left:24px solid #fff;border-top:15px solid transparent;border-bottom:15px solid transparent}
.player.playing .bigplay{opacity:0;transform:scale(1.4)}
.spin{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite;display:none;z-index:5}
@keyframes r{to{transform:rotate(360deg)}}
.player.buffering .spin{display:block}
.player.buffering .bigplay{opacity:0}

/* double-tap seek ripple */
.rip{position:absolute;top:0;bottom:0;width:38%;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:600;opacity:0;pointer-events:none;z-index:4;transition:opacity .25s;background:rgba(255,255,255,.12)}
.rip.l{left:0;border-radius:0 50% 50% 0}
.rip.r{right:0;border-radius:50% 0 0 50%}
.rip.show{opacity:1}

/* bottom controls */
.ctrl{position:absolute;left:0;right:0;bottom:0;padding:26px 12px max(12px,env(safe-area-inset-bottom));color:#fff;z-index:3;background:linear-gradient(transparent,rgba(0,0,0,.7));transition:opacity .3s}
.player.hide-ui .ctrl,.player.hide-ui .head{opacity:0}
.track{position:relative;height:22px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.track .rail{position:relative;flex:1;height:4px;background:#5a5a5a;border-radius:2px;overflow:hidden;transition:height .15s}
.track:hover .rail,.track.drag .rail{height:6px}
.track .buf{position:absolute;inset:0 auto 0 0;width:38%;background:#9a9a9a}
.track .pos{position:absolute;inset:0 auto 0 0;width:0;background:#2f7bf5}
.track .knob{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#2f7bf5;left:0;transform:scale(0);transition:transform .15s}
.track:hover .knob,.track.drag .knob,.player.paused .knob{transform:scale(1)}
.row{display:flex;align-items:center;gap:4px;margin-top:2px}
.btn{width:44px;height:44px;display:grid;place-items:center;flex:none;border-radius:50%}
.btn:active{background:rgba(255,255,255,.15)}
.btn svg{width:24px;height:24px;fill:#fff}
.time{font-size:13px;font-variant-numeric:tabular-nums;margin:0 6px;white-space:nowrap}
.sp{flex:1}
.q{font-size:11px;font-weight:700;border:1.5px solid #fff;border-radius:3px;padding:0 3px;line-height:15px}
@media (max-width:420px){.hide-s{display:none}}

/* alert */
.dim{position:absolute;inset:0;z-index:6;display:none}
.player.locked .dim{display:block}
.alert{position:absolute;left:50%;top:29%;transform:translate(-50%,0) scale(1.15);width:min(400px,calc(100% - 40px));background:rgba(242,242,242,.97);border-radius:14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .3s cubic-bezier(.2,1.4,.4,1);z-index:7;box-shadow:0 10px 40px rgba(0,0,0,.5);overflow:hidden}
.player.locked .alert{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.player.locked .alert.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translate(calc(-50% - 8px),0)}40%,80%{transform:translate(calc(-50% + 8px),0)}}
.alert h2{font-size:20px;font-weight:700;color:#000;padding:16px 16px 4px}
.alert p{font-size:14px;line-height:1.3;color:#111;padding:0 18px 10px}
.alert .meta{display:flex;justify-content:center;gap:14px;font-size:12px;color:#555;padding:0 12px 12px}
.alert .meta b{color:#16a34a}
.alert a{display:block;border-top:1px solid #c8c8c8;padding:13px 14px 15px;font-size:18px;color:#1a7cf5;text-decoration:none;position:relative;overflow:hidden}
.alert a:active{background:#dcdcdc}
.alert a i{position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(26,124,245,.15),transparent);transform:translateX(-100%);animation:sh 2.2s infinite}
@keyframes sh{60%,100%{transform:translateX(100%)}}
.alert a.wait{color:#888;pointer-events:none}
@media (max-width:767px) and (orientation:portrait){.alert{top:auto;bottom:calc(120px + env(safe-area-inset-bottom))}.alert h2{font-size:19px}.alert a{font-size:19px;padding:16px 14px 18px}}

/* toast */
.toast{position:absolute;left:50%;top:max(64px,calc(env(safe-area-inset-top) + 56px));transform:translate(-50%,-10px);background:rgba(20,20,20,.88);color:#fff;font-size:13px;padding:8px 14px;border-radius:999px;opacity:0;transition:.25s;z-index:8;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
[dir=rtl] .head{flex-direction:row-reverse}
</style>
</head>

      if (locked) return;
      playing = true; player.classList.add("playing"); player.classList.remove("paused"); setPP(); showUI();
      if (vid) vid.play().catch(function(){}); else raf = requestAnimationFrame(draw);
      clearInterval(tick);
      tick = setInterval(function(){ cur++; render(); if (cur >= lockAt) lock(); }, 1000);
    });
  };
  var pause = function(){
    playing = false; clearInterval(tick); cancelAnimationFrame(raf); if (vid) vid.pause();
    player.classList.remove("playing"); player.classList.add("paused"); setPP(); showUI();
  };
  var lock = function(){
    pause(); locked = true; player.classList.add("locked"); player.classList.remove("hide-ui");
    if (CONFIG.VIBRATE && navigator.vibrate) { try { navigator.vibrate(60); } catch(e){} }
  };
  var unlock = function(){
    locked = false; player.classList.remove("locked");
    lockAt = cur + CONFIG.RESUME_SEC;
    toast(t.resume);
    setTimeout(play, 300);
  };

  /* taps on the player: first tap plays; then single tap toggles UI, double tap seeks */
  var lastTap = 0, tapT;
  player.addEventListener("click", function(e){
    if (locked) return;
    if (!playing) { play(); return; }
    var now = Date.now(), r = player.getBoundingClientRect(), x = e.clientX - r.left;
    if (isTouch && now - lastTap < 300) {
      clearTimeout(tapT);
      var right = x > r.width / 2, el = right ? $("ripR") : $("ripL");
      el.classList.add("show"); setTimeout(function(){ el.classList.remove("show"); }, 450);
      if (right) { cur += 10; render(); pause(); buffer(700, lock); } else { cur = Math.max(0, cur - 10); render(); }
      lastTap = 0; return;
    }
    lastTap = now;
    tapT = setTimeout(function(){
      if (player.classList.contains("hide-ui")) showUI(); else if (isTouch) player.classList.add("hide-ui"); else pause();
    }, isTouch ? 260 : 0);
  });

  /* buttons */
  var stop = function(fn){ return function(e){ e.stopPropagation(); showUI(); fn(e); }; };
  $("ppBtn").addEventListener("click", stop(function(){ playing ? pause() : play(); }));
  $("volBtn").addEventListener("click", stop(function(){ muted = !muted; setVol(); if (vid) vid.muted = muted; }));
  $("qBtn").addEventListener("click", stop(function(){ toast(t.q); }));
  $("setBtn").addEventListener("click", stop(function(){ toast(t.q); }));
  $("fsBtn").addEventListener("click", stop(function(){
    var rq = player.requestFullscreen || player.webkitRequestFullscreen;
    var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (fsEl) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    if (rq) {
      try {
        var pr = rq.call(player);
        if (pr && pr.then) pr.then(function(){ if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function(){}); }).catch(function(){ toast(t.fs); });
      } catch(e) { toast(t.fs); }
    } else toast(t.fs);
  }));
  $("likeBtn").addEventListener("click", stop(function(){
    liked = !liked; likeN += liked ? 1 : -1; $("likes").textContent = fmtK(likeN);
    var b = $("likeBtn"); b.classList.remove("on"); void b.offsetWidth; if (liked) b.classList.add("on");
  }));
  $("closeBtn").addEventListener("click", stop(function(){ if (locked) unlock(); else if (playing) pause(); }));

  /* scrubbing: any seek buffers, then popup */
  var track = $("track"), dragging = false;
  var seekTo = function(clientX){ var r = track.getBoundingClientRect(); var p = Math.min(Math.max((clientX - r.left) / r.width, 0), 1); cur = Math.round(p * CONFIG.DURATION); render(); };
  track.addEventListener("pointerdown", function(e){ e.stopPropagation(); if (locked) return; dragging = true; track.classList.add("drag"); try { track.setPointerCapture(e.pointerId); } catch(_){} seekTo(e.clientX); showUI(); });
  track.addEventListener("pointermove", function(e){ if (dragging) seekTo(e.clientX); });
  track.addEventListener("pointerup", function(){ if (!dragging) return; dragging = false; track.classList.remove("drag"); pause(); buffer(900, lock); });
  track.addEventListener("click", function(e){ e.stopPropagation(); });

  /* alert: install goes to offer, tap outside nudges the alert */
  $("aBtn").addEventListener("click", go);
  $("alert").addEventListener("click", function(e){ e.stopPropagation(); });
  $("dim").addEventListener("click", function(e){
    e.stopPropagation(); var a = $("alert"); a.classList.remove("shake"); void a.offsetWidth; a.classList.add("shake");
  });

  /* desktop keyboard */
  document.addEventListener("keydown", function(e){
    if (e.code === "Space" || e.code === "KeyK") { e.preventDefault(); if (!locked) (playing ? pause() : play()); }
    if (e.code === "ArrowRight" && !locked) { cur += 10; render(); pause(); buffer(700, lock); }
    if (e.code === "Enter" && locked) go();
  });
  player.addEventListener("mousemove", function(){ if (!isTouch) showUI(); });

  /* pause when the tab is hidden, so the popup is not missed */
  document.addEventListener("visibilitychange", function(){ if (document.hidden && playing) pause(); });

  if (CONFIG.AUTOPLAY) play();

  if (CONFIG.BACK_REDIRECT) {
    history.pushState(null, "", location.href);
    window.addEventListener("popstate", function(){ window.location.replace(offer); });
  }
})();
</script>
</body>
</html>
