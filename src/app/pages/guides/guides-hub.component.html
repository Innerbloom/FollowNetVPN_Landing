<section class="guides-hub">
  <div class="container">
    <header class="hub-hero">
      <p class="kicker">FollowNet</p>
      <h1>{{ i18n.t('GUIDES_TITLE') }}</h1>
      <p class="lead">{{ i18n.t('GUIDES_LEAD') }}</p>
      <nav class="hub-nav" [attr.aria-label]="i18n.t('NAV_GUIDES')">
        <a
          *ngFor="let s of sections"
          class="hub-chip"
          [routerLink]="'/guides' | localize"
          [fragment]="s.id"
          >{{ s.title }}<span class="hub-chip__count">{{ s.cards.length }}</span></a
        >
      </nav>
    </header>

    <section class="hub-section" *ngFor="let s of sections" [id]="s.id" [attr.aria-labelledby]="s.id + '-title'">
      <div class="hub-section__head">
        <h2 [id]="s.id + '-title'">{{ s.title }}</h2>
        <p>{{ s.note }}</p>
      </div>
      <div class="guide-grid">
        <a class="guide-card" *ngFor="let g of s.cards" [routerLink]="(['/', g.slug]) | localize">
          <h3 class="guide-title">{{ g.title }}</h3>
          <p class="guide-lead">{{ g.lead }}</p>
          <span class="guide-meta">{{ i18n.t('GUIDE_READ') }} <span aria-hidden="true">→</span></span>
        </a>
      </div>
    </section>
  </div>
</section>
